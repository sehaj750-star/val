<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Jayita, will you go on a date with me?</title>

  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg1: #ffd6e7;
      --bg2: #ffeef6;
      --card: #ffffffcc;
      --yes: #ff3b7a;
      --yesHover: #ff1f68;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      font-family: system-ui, sans-serif;
      overflow: hidden;
      padding: 16px;
    }

    /* FULL-SCREEN CONFETTI CANVAS */
    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    .card {
      width: min(720px, 92vw);
      padding: 26px 22px;
      background: var(--card);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,.15);
    }

    .art {
      width: min(260px, 80vw);
      margin: 0 auto 10px;
      display: block;
      filter: drop-shadow(0 10px 14px rgba(0,0,0,.12));
    }

    h1 {
      font-size: clamp(26px, 4vw, 44px);
      margin: 12px 0 18px;
    }

    .button-zone {
      position: relative;
      width: min(520px, 92%);
      height: clamp(180px, 32vw, 220px);
      margin: 0 auto;
      touch-action: none;
    }

    button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 16px 24px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,.14);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      transition: transform .12s ease, background .12s ease;
    }

    #noBtn {
      position: relative;
      top: auto;
      left: auto;
      background: #e5e7eb;
      color: #111827;
      transition: background .12s ease;
      animation: noFloat 2.8s ease-in-out infinite;
      will-change: transform;
    }

    #yesBtn {
      left: 18%;
      background: var(--yes);
      color: #fff;
      z-index: 3;
    }
    #yesBtn:hover { background: var(--yesHover); }

    .no-btn-shell {
      position: absolute;
      top: 50%;
      left: 62%;
      transform: translateY(-50%);
      z-index: 1;
    }

    @keyframes noFloat {
      0%, 100% {
        transform: translate3d(0, 0, 0) rotate(-1deg);
      }
      33% {
        transform: translate3d(8px, -10px, 0) rotate(1deg);
      }
      66% {
        transform: translate3d(5px, -6px, 0) rotate(-0.5deg);
      }
    }

    @media (pointer: coarse) {
      button {
        padding: 18px 28px;
        font-size: 20px;
      }
    }

    .hint {
      margin-top: 10px;
      font-size: 13px;
      opacity: .7;
    }

    .step-screen {
      display: none;
      margin-top: 8px;
      animation: pop .35s ease;
    }

    .step-screen.active {
      display: block;
    }

    .step-screen h2 {
      font-size: clamp(28px, 4.5vw, 42px);
      margin: 8px 0 6px;
    }

    .step-sub {
      margin: 0 0 20px;
      font-size: 16px;
      opacity: 0.75;
    }

    .choice-zone {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: min(320px, 88%);
      margin: 0 auto;
    }

    .choice-btn {
      position: relative;
      top: auto;
      left: auto;
      transform: none;
      width: 100%;
      padding: 18px 24px;
      font-size: 20px;
      background: var(--yes);
      color: #fff;
      animation: choicePulse 2.4s ease-in-out infinite;
    }

    .choice-btn:nth-child(2) { animation-delay: 0.25s; }
    .choice-btn:nth-child(3) { animation-delay: 0.5s; }

    .choice-btn:hover {
      background: var(--yesHover);
    }

    .step-gif {
      width: min(340px, 90vw);
      margin: 12px auto 0;
      display: block;
      border-radius: 16px;
    }

    @keyframes choicePulse {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    @keyframes pop {
      from { transform: scale(.96); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>

  <main class="card">
    <div id="askScreen">
      <svg class="art" viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="fur" x1="0" x2="1">
          <stop offset="0" stop-color="#f7c7a1"/>
          <stop offset="1" stop-color="#f2a97b"/>
        </linearGradient>
        <linearGradient id="heart" x1="0" x2="1">
          <stop offset="0" stop-color="#ff4d7d"/>
          <stop offset="1" stop-color="#ff1f68"/>
        </linearGradient>
      </defs>

      <path d="M250 50 C250 33 270 25 282 38
               C294 25 314 33 314 50
               C314 78 282 92 282 106
               C282 92 250 78 250 50Z"
            fill="url(#heart)"/>

      <path d="M90 120 C90 70 140 40 190 60
               C240 40 290 70 290 120
               C290 180 240 210 190 210
               C140 210 90 180 90 120Z"
            fill="url(#fur)"/>

      <path d="M110 92 L95 55 L140 78 Z" fill="#f2a97b"/>
      <path d="M270 92 L285 55 L240 78 Z" fill="#f2a97b"/>

      <circle cx="160" cy="130" r="8"/>
      <circle cx="220" cy="130" r="8"/>

      <path d="M190 144 C186 144 182 148 182 152
               C182 160 190 164 190 170
               C190 164 198 160 198 152
               C198 148 194 144 190 144Z"
            fill="#ff7aa2"/>
    </svg>

    <h1>Jayita, will you go on a date with me?</h1>

    <section class="button-zone" id="zone">
      <button id="yesBtn">Yes</button>
      <div class="no-btn-shell" id="noBtnShell">
        <button id="noBtn">No</button>
      </div>
    </section>

    <!-- HINT -->
    <div class="hint" id="hint">“No” seems a bit shy 😈</div>
    </div>

    <section class="step-screen" id="dateScreen">
      <h2>Next Week</h2>
      <p class="step-sub">When are you free?</p>
      <div class="choice-zone">
        <button class="choice-btn" type="button" data-day="Thursday">Thursday</button>
        <button class="choice-btn" type="button" data-day="Friday">Friday</button>
        <button class="choice-btn" type="button" data-day="Saturday">Saturday</button>
      </div>
    </section>

    <section class="step-screen" id="venueScreen">
      <h2>Venue to follow soon</h2>
      <p class="step-sub" id="venueSub">Can't wait — details coming your way! ✨</p>
      <img
        class="step-gif"
        src="https://media.giphy.com/media/3o7abKhOpu0NwenH3O/giphy.gif"
        alt="Excited for the date"
      />
    </section>
  </main>

  <script>
    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const noBtnShell = document.getElementById("noBtnShell");
    const askScreen = document.getElementById("askScreen");
    const dateScreen = document.getElementById("dateScreen");
    const venueScreen = document.getElementById("venueScreen");
    const venueSub = document.getElementById("venueSub");
    const hint = document.getElementById("hint");

    /* ---------- NOTIFY YOU WHEN SHE PICKS ---------- */
    const NOTIFY = {
      // Install the "ntfy" app (iOS/Android), subscribe to this topic for instant alerts.
      ntfyTopic: "jayita-date-sehaj750",
      // Optional: your email for a backup email (verify once at formsubmit.co).
      email: ""
    };

    async function notifyYou(message, subject = "Date page update") {
      if (NOTIFY.ntfyTopic) {
        fetch(`https://ntfy.sh/${NOTIFY.ntfyTopic}`, {
          method: "POST",
          body: message,
          headers: {
            Title: subject,
            Priority: "high",
            Tags: "heart"
          }
        }).catch(() => {});
      }

      if (NOTIFY.email) {
        fetch(`https://formsubmit.co/ajax/${encodeURIComponent(NOTIFY.email)}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Accept: "application/json"
          },
          body: JSON.stringify({
            _subject: subject,
            message
          })
        }).catch(() => {});
      }
    }

    /* ---------- CONFETTI ---------- */
    const confettiCanvas = document.getElementById("confettiCanvas");

    function resizeConfettiCanvas() {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      confettiCanvas.width = Math.floor(window.innerWidth * dpr);
      confettiCanvas.height = Math.floor(window.innerHeight * dpr);
      confettiCanvas.style.width = "100vw";
      confettiCanvas.style.height = "100vh";
    }

    resizeConfettiCanvas();
    window.addEventListener("resize", resizeConfettiCanvas);
    window.addEventListener("orientationchange", () => setTimeout(resizeConfettiCanvas, 150));

    const confettiInstance = confetti.create(confettiCanvas, {
      resize: false,
      useWorker: true
    });

    function fullScreenConfetti() {
      const end = Date.now() + 1600;

      (function frame() {
        confettiInstance({
          particleCount: 12,
          spread: 90,
          startVelocity: 45,
          ticks: 180,
          origin: { x: Math.random(), y: Math.random() * 0.3 }
        });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();

      setTimeout(() => {
        confettiInstance({
          particleCount: 300,
          spread: 140,
          startVelocity: 60,
          ticks: 220,
          origin: { x: 0.5, y: 0.55 }
        });
      }, 300);
    }

    /* ---------- YES BUTTON GROWS ---------- */
    let yesScale = 1;
    function growYes() {
      yesScale = Math.min(2.2, yesScale + 0.1);
      yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
    }

    /* ---------- NO BUTTON RUNS AWAY ---------- */
    const isTouchDevice = window.matchMedia("(pointer: coarse)").matches;
    const chaseRadius = isTouchDevice ? 190 : 140;

    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    function placeNo(left, top) {
      noBtnShell.style.left = left + "px";
      noBtnShell.style.top = top + "px";
      noBtnShell.style.transform = "none";
    }

    function zoneBounds() {
      const z = zone.getBoundingClientRect();
      const b = noBtnShell.getBoundingClientRect();
      return {
        z,
        maxLeft: Math.max(0, z.width - b.width),
        maxTop: Math.max(0, z.height - b.height),
        btnW: b.width,
        btnH: b.height
      };
    }

    function getYesRectInZone(pad = 16) {
      const z = zone.getBoundingClientRect();
      const yes = yesBtn.getBoundingClientRect();
      return {
        left: yes.left - z.left - pad,
        top: yes.top - z.top - pad,
        right: yes.right - z.left + pad,
        bottom: yes.bottom - z.top + pad
      };
    }

    function isValidNoPosition(left, top, btnW, btnH) {
      const yes = getYesRectInZone();
      const noRight = left + btnW;
      const noBottom = top + btnH;
      const overlaps = !(
        left > yes.right ||
        noRight < yes.left ||
        top > yes.bottom ||
        noBottom < yes.top
      );
      return !overlaps;
    }

    function scoreNoPosition(left, top, btnW, btnH, px, py) {
      const { z } = zoneBounds();
      const cx = z.left + left + btnW / 2;
      const cy = z.top + top + btnH / 2;
      const awayFromTouch = Math.hypot(cx - px, cy - py);
      const yes = yesBtn.getBoundingClientRect();
      const awayFromYes = Math.hypot(
        cx - (yes.left + yes.width / 2),
        cy - (yes.top + yes.height / 2)
      );
      return awayFromTouch + awayFromYes * 0.5;
    }

    function pickNoPosition(px, py, preferredLeft, preferredTop) {
      const { maxLeft, maxTop, btnW, btnH } = zoneBounds();

      if (
        preferredLeft != null &&
        isValidNoPosition(preferredLeft, preferredTop, btnW, btnH)
      ) {
        return { left: preferredLeft, top: preferredTop };
      }

      let bestLeft = null;
      let bestTop = null;
      let bestScore = -1;

      for (let i = 0; i < 28; i++) {
        const left = Math.random() * maxLeft;
        const top = Math.random() * maxTop;
        if (!isValidNoPosition(left, top, btnW, btnH)) continue;
        const score = scoreNoPosition(left, top, btnW, btnH, px, py);
        if (score > bestScore) {
          bestScore = score;
          bestLeft = left;
          bestTop = top;
        }
      }

      if (bestLeft != null) {
        return { left: bestLeft, top: bestTop };
      }

      const yes = getYesRectInZone();
      const candidates = [
        { left: yes.right + 8, top: yes.top },
        { left: yes.right + 8, top: yes.bottom - btnH },
        { left: maxLeft, top: maxTop },
        { left: 0, top: maxTop }
      ];

      for (const spot of candidates) {
        const left = clamp(spot.left, 0, maxLeft);
        const top = clamp(spot.top, 0, maxTop);
        if (isValidNoPosition(left, top, btnW, btnH)) {
          return { left, top };
        }
      }

      return { left: maxLeft, top: maxTop };
    }

    function instantDodgeNo(px, py) {
      const { left, top } = pickNoPosition(px, py);
      placeNo(left, top);
      growYes();
    }

    function moveNo(px, py) {
      const { z, maxLeft, maxTop } = zoneBounds();
      const b = noBtnShell.getBoundingClientRect();

      let dx = (b.left + b.width / 2) - px;
      let dy = (b.top + b.height / 2) - py;
      let mag = Math.hypot(dx, dy) || 1;
      dx /= mag;
      dy /= mag;

      const jump = isTouchDevice ? 190 : 150;
      let newLeft = (b.left - z.left) + dx * jump;
      let newTop = (b.top - z.top) + dy * jump;

      newLeft = clamp(newLeft, 0, maxLeft);
      newTop = clamp(newTop, 0, maxTop);

      const picked = pickNoPosition(px, py, newLeft, newTop);
      placeNo(picked.left, picked.top);
      growYes();
    }

    function chasePointer(px, py) {
      const b = noBtnShell.getBoundingClientRect();
      const d = Math.hypot(
        (b.left + b.width / 2) - px,
        (b.top + b.height / 2) - py
      );
      if (d < chaseRadius) moveNo(px, py);
    }

    zone.addEventListener("pointermove", e => chasePointer(e.clientX, e.clientY));
    zone.addEventListener("touchmove", e => {
      const t = e.touches[0];
      if (t) chasePointer(t.clientX, t.clientY);
    }, { passive: true });

    let lastNoDodge = 0;

    function onNoTap(e) {
      e.preventDefault();
      e.stopPropagation();
      const now = Date.now();
      if (now - lastNoDodge < 100) return;
      lastNoDodge = now;
      const point = e.touches?.[0] ?? e;
      instantDodgeNo(point.clientX, point.clientY);
    }

    noBtn.addEventListener("pointerdown", onNoTap, { passive: false });
    noBtn.addEventListener("click", e => e.preventDefault());

    function showScreen(screen) {
      askScreen.style.display = screen === askScreen ? "block" : "none";
      dateScreen.classList.toggle("active", screen === dateScreen);
      venueScreen.classList.toggle("active", screen === venueScreen);
    }

    document.querySelectorAll(".choice-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const day = btn.dataset.day;
        notifyYou(`Jayita picked ${day} for the date!`, "She picked a day 💕");
        venueSub.textContent = `Can't wait for ${day}! Venue details coming your way ✨`;
        showScreen(venueScreen);
        resizeConfettiCanvas();
        fullScreenConfetti();
      });
    });

    /* ---------- YES CLICK ---------- */
    yesBtn.addEventListener("click", () => {
      notifyYou("Jayita said YES to the date!", "She said yes! 🎉");
      showScreen(dateScreen);
      resizeConfettiCanvas();
      fullScreenConfetti();
    });
  </script>
</body>
</html>
